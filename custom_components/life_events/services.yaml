add_event:
  name: Add event
  description: Add a birthday, anniversary or deceased entry.
  fields:
    name:
      required: true
      example: "Frodo Baggins"
      selector:
        text:
    date:
      required: true
      example: "1921-09-22"
      selector:
        date:
    event_type:
      required: false
      default: birthday
      selector:
        select:
          options:
            - birthday
            - anniversary
            - deceased
    event_id:
      required: false
      description: Optional stable id/entity_id suffix. Auto-generated from the name if omitted.
      selector:
        text:
    date_of_death:
      required: false
      selector:
        date:
    icon:
      required: false
      example: "mdi:cake"
      selector:
        icon:
    phone_number:
      required: false
      description: "E.164 format, e.g. +31612345678. Only meaningful for birthday/anniversary events."
      example: "+31612345678"
      selector:
        text:
    time:
      required: false
      description: "Optional time of day (e.g. birth time), purely informational."
      selector:
        time:
    parent_ids:
      required: false
      description: "At most 2 event ids of this person's parents. Not mirrored on the parent's own record."
      selector:
        object:
    attributes:
      required: false
      description: Freeform extra attributes (key/value pairs).
      selector:
        object:

update_event:
  name: Update event
  description: Update an existing event. Only the provided fields are changed.
  fields:
    event_id:
      required: true
      selector:
        text:
    name:
      required: false
      selector:
        text:
    date:
      required: false
      selector:
        date:
    event_type:
      required: false
      selector:
        select:
          options:
            - birthday
            - anniversary
            - deceased
    date_of_death:
      required: false
      selector:
        date:
    icon:
      required: false
      selector:
        icon:
    phone_number:
      required: false
      description: "E.164 format, e.g. +31612345678. Only meaningful for birthday/anniversary events."
      selector:
        text:
    time:
      required: false
      description: "Optional time of day (e.g. birth time), purely informational."
      selector:
        time:
    parent_ids:
      required: false
      description: "At most 2 event ids of this person's parents. Not mirrored on the parent's own record."
      selector:
        object:
    attributes:
      required: false
      selector:
        object:

delete_event:
  name: Delete event
  description: Remove an event.
  fields:
    event_id:
      required: true
      selector:
        text:

import_events:
  name: Import events
  description: Bulk import events from a CSV or JSON string.
  fields:
    content:
      required: true
      selector:
        text:
          multiline: true
    format:
      required: false
      default: json
      selector:
        select:
          options:
            - csv
            - json
    mode:
      required: false
      default: merge
      description: "merge keeps existing events, replace clears them first."
      selector:
        select:
          options:
            - merge
            - replace

export_events:
  name: Export events
  description: Export all events as a CSV or JSON string.
  fields:
    format:
      required: false
      default: json
      selector:
        select:
          options:
            - csv
            - json

set_fixed_attributes:
  name: Set fixed attributes
  description: >-
    Replace the schema of fixed (required) custom attributes, e.g. a
    required "geslacht" dropdown with Man/Vrouw/Anders. Normally set via the
    Manage card's editor, not called directly.
  fields:
    fixed_attributes:
      required: true
      description: List of {key, options} objects. Omit options for a required free-text field.
      selector:
        object:

get_fixed_attributes:
  name: Get fixed attributes
  description: Return the current schema of fixed (required) custom attributes.

link_marriage:
  name: Link marriage
  description: >-
    Link two existing persons as spouses or partners, symmetrically, with a
    shared anniversary date. Normally called from the Manage/Upcoming/Month
    cards' "Trouwen"/"Koppelen" action, not directly.
  fields:
    event_id:
      required: true
      selector:
        text:
    spouse_id:
      required: true
      selector:
        text:
    marriage_date:
      required: true
      selector:
        date:
    relationship_type:
      required: false
      default: married
      description: "married = getrouwd, registered_partnership = geregistreerd partnerschap, relationship = relatie."
      selector:
        select:
          options:
            - married
            - registered_partnership
            - relationship

unlink_marriage:
  name: Unlink marriage
  description: >-
    Divorce: symmetrically clear the marriage link on both sides. Normally
    called from the cards' "Scheiden" action, not directly.
  fields:
    event_id:
      required: true
      selector:
        text:
